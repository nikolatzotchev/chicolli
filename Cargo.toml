[package]
name = "chicolli"
version = "0.1.0"
edition = "2021"

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_10"]

[features]
default = ["hidpi-cursors"]
# Renders tool cursors at the output's scale so they stay sharp on HiDPI screens.
# Needs GTK 4.16 or newer; build with `--no-default-features` on older GTK.
hidpi-cursors = ["gtk/v4_16"]

[dependencies]
gio = "0.22"
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
pangocairo = "0.22.9"


